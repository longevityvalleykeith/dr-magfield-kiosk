name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Durable state adversarial cases (includes held RT02)
        run: node --test tests/astra-rt01-05.test.mjs tests/state-durable.test.mjs
      # The censuses read the built chunks, so build first (no env: the check stays off).
      - run: npm run build
      - run: npm test
